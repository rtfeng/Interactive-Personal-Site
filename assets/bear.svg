<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Bear form: an armoured circuit-board bear with glowing eyes, bared fangs and a crescent-moon shield">
  <defs>
    <radialGradient id="bgT" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#2a6b67"/>
      <stop offset="1" stop-color="#0c2d2e"/>
    </radialGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b5a52"/>
      <stop offset="1" stop-color="#0a2f2c"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23695f"/>
      <stop offset="1" stop-color="#103f3a"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0b877"/>
      <stop offset="1" stop-color="#a8692e"/>
    </linearGradient>
    <linearGradient id="shieldG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a40"/>
      <stop offset="1" stop-color="#141c20"/>
    </linearGradient>
    <filter id="glowT" x="-100%" y="-200%" width="300%" height="500%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clipT"><rect x="0" y="28" width="200" height="172" rx="14"/></clipPath>
    <symbol id="lf" viewBox="-6 -10 12 20"><path d="M0 9 C-7 3 -6 -6 0 -9 C6 -6 7 3 0 9 Z" fill="#78c158"/><path d="M0 8 V-7" stroke="#3b7a2a" stroke-width="1.2"/></symbol>
  </defs>

  <rect x="0" y="28" width="200" height="172" rx="14" fill="url(#bgT)"/>

  <g clip-path="url(#clipT)">
    <!-- ground glow -->
    <ellipse cx="100" cy="204" rx="90" ry="16" fill="#7cf0a8" opacity=".12"/>

    <!-- massive shoulder humps / pauldrons -->
    <path d="M-4 204 L4 120 L22 74 L56 58 L78 70 L70 120 L60 204 Z" fill="url(#armor)" stroke="url(#copper)" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M204 204 L196 120 L178 74 L144 58 L122 70 L130 120 L140 204 Z" fill="url(#armor)" stroke="url(#copper)" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- armour plate seams -->
    <g fill="none" stroke="#c98a4a" stroke-width="1.6" stroke-opacity=".8" stroke-linejoin="round">
      <path d="M10 104 L34 92 L66 100"/><path d="M6 146 L36 136 L68 146"/>
      <path d="M190 104 L166 92 L134 100"/><path d="M194 146 L164 136 L132 146"/>
    </g>
    <!-- rivets -->
    <g fill="#f0b877">
      <circle cx="30" cy="80" r="2.4"/><circle cx="52" cy="70" r="2.4"/><circle cx="20" cy="118" r="2.4"/><circle cx="50" cy="122" r="2.4"/><circle cx="24" cy="164" r="2.4"/>
      <circle cx="170" cy="80" r="2.4"/><circle cx="148" cy="70" r="2.4"/><circle cx="180" cy="118" r="2.4"/><circle cx="150" cy="122" r="2.4"/><circle cx="176" cy="164" r="2.4"/>
    </g>
    <!-- circuit traces on armour -->
    <g fill="none" stroke="#e0a868" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 80 V96 L40 106 V118 L50 122"/>
      <path d="M170 80 V96 L160 106 V118 L150 122"/>
    </g>

    <!-- planted paws with claws -->
    <g>
      <path d="M38 204 C36 186 46 176 60 176 C74 176 80 188 78 204 Z" fill="#0e3633" stroke="url(#copper)" stroke-width="2.4"/>
      <path d="M44 184 l-4 -12 l8 9 Z M56 180 l-1 -13 l6 11 Z M68 182 l3 -12 l2 13 Z" fill="#dfe8ea" stroke="#7f8f95" stroke-width="1"/>
      <path d="M162 204 C164 186 154 176 140 176 C126 176 120 188 122 204 Z" fill="#0e3633" stroke="url(#copper)" stroke-width="2.4"/>
      <path d="M156 184 l4 -12 l-8 9 Z M144 180 l1 -13 l-6 11 Z M132 182 l-3 -12 l-2 13 Z" fill="#dfe8ea" stroke="#7f8f95" stroke-width="1"/>
    </g>
  </g>

  <!-- ears (angular, laid back) -->
  <path d="M66 76 L60 56 L80 66 Z" fill="url(#armor)" stroke="url(#copper)" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M134 76 L140 56 L120 66 Z" fill="url(#armor)" stroke="url(#copper)" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- head, lowered and squared -->
  <path d="M64 76 L100 64 L136 76 L150 102 L136 134 L100 152 L64 134 L50 102 Z" fill="url(#face)" stroke="url(#copper)" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- forehead trace -->
  <path d="M100 64 V80" stroke="#e0a868" stroke-width="2" stroke-linecap="round"/>
  <circle cx="100" cy="80" r="2.6" fill="#f0b877"/>

  <!-- heavy brow plate -->
  <path d="M58 88 L100 100 L142 88 L138 78 L100 90 L62 78 Z" fill="#0b2624" stroke="url(#copper)" stroke-width="2" stroke-linejoin="round"/>

  <!-- narrowed LED eyes -->
  <g filter="url(#glowT)">
    <path d="M68 96 L92 104 L89 109 L71 103 Z" fill="#7cf0a8"/>
    <path d="M132 96 L108 104 L111 109 L129 103 Z" fill="#7cf0a8"/>
  </g>
  <path d="M74 100 L88 105 L87 106.5 L75 102 Z" fill="#effff5"/>
  <path d="M126 100 L112 105 L113 106.5 L125 102 Z" fill="#effff5"/>

  <!-- muzzle -->
  <path d="M78 112 L122 112 L118 138 L100 148 L82 138 Z" fill="#1d6a5f" stroke="url(#copper)" stroke-width="2" stroke-linejoin="round"/>
  <!-- chip nose -->
  <rect x="89" y="109" width="22" height="10" rx="2.5" fill="#101618"/>
  <g fill="#c98a4a"><rect x="91" y="106.5" width="2" height="3"/><rect x="96" y="106.5" width="2" height="3"/><rect x="102" y="106.5" width="2" height="3"/><rect x="107" y="106.5" width="2" height="3"/></g>
  <!-- snarling mouth -->
  <path d="M85 124 L115 124 L110 140 L100 145 L90 140 Z" fill="#081413"/>
  <path d="M86 124 L91 135 L94 124 Z M106 124 L109 135 L114 124 Z" fill="#eef4f5"/>
  <path d="M95 124 L97 129 L99 124 Z M101 124 L103 129 L105 124 Z" fill="#eef4f5"/>
  <path d="M91 141 L94 134 L97 143 Z M103 143 L106 134 L109 141 Z" fill="#eef4f5"/>
  <path d="M85 124 H115" stroke="#e0a868" stroke-width="1.6"/>

  <!-- vines wrapping the armour -->
  <g fill="none" stroke="#5ea948" stroke-width="2.6" stroke-linecap="round">
    <path d="M6 190 C20 170 8 150 22 136 C34 124 26 104 40 92"/>
    <path d="M194 186 C180 168 192 150 178 136 C168 126 174 108 162 94"/>
  </g>
  <use href="#lf" x="34" y="80" width="11" height="17" transform="rotate(35 39 88)"/>
  <use href="#lf" x="14" y="126" width="10" height="16" transform="rotate(-40 19 134)"/>
  <use href="#lf" x="156" y="82" width="11" height="17" transform="rotate(-35 161 90)"/>
  <use href="#lf" x="178" y="128" width="10" height="16" transform="rotate(40 183 136)"/>
  <use href="#lf" x="8" y="164" width="10" height="16" transform="rotate(-70 13 172)"/>

  <!-- tank shield -->
  <g transform="translate(100 150)">
    <path d="M-30 4 L0 -4 L30 4 V26 C30 40 16 48 0 54 C-16 48 -30 40 -30 26 Z" fill="url(#shieldG)" stroke="url(#copper)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-24 8 L0 2 L24 8 V26 C24 36 13 43 0 48 C-13 43 -24 36 -24 26 Z" fill="none" stroke="#c98a4a" stroke-width="1.2" stroke-opacity=".7"/>
    <!-- crescent moon -->
    <path d="M5 12 A12 12 0 1 0 5 34 A9.4 9.4 0 1 1 5 12 Z" fill="#f1e6c8"/>
    <!-- leaf -->
    <use href="#lf" x="6" y="16" width="9" height="14" transform="rotate(30 10 23)"/>
    <g fill="#f0b877"><circle cx="-24" cy="8" r="1.8"/><circle cx="24" cy="8" r="1.8"/><circle cx="0" cy="2" r="1.8"/></g>
  </g>
</svg>
