<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Bear form: a bear drawn as a circuit board, with copper traces growing into vines and leaves">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7570"/>
      <stop offset="1" stop-color="#16484a"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14524a"/>
      <stop offset="1" stop-color="#0b3532"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clipC"><rect x="0" y="28" width="200" height="172" rx="14"/></clipPath>
    <symbol id="leaf" viewBox="-6 -10 12 20"><path d="M0 9 C-7 3 -6 -6 0 -9 C6 -6 7 3 0 9 Z" fill="#7cc35a"/><path d="M0 8 V-7" stroke="#3f7d2c" stroke-width="1.1"/></symbol>
  </defs>

  <!-- background block -->
  <rect x="0" y="28" width="200" height="172" rx="14" fill="url(#bgC)"/>
  <!-- faint background traces -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="2">
    <path d="M8 60 H30 L40 70 V120 M192 70 H172 L164 78 V130 M10 150 H26 M174 150 H192"/>
  </g>

  <!-- shoulders (board) -->
  <g clip-path="url(#clipC)">
    <path d="M16 200 C20 160 48 140 100 138 C152 140 180 160 184 200 Z" fill="url(#pcb)" stroke="#c98a4a" stroke-width="2.5"/>
  </g>

  <!-- ears -->
  <g stroke="#c98a4a" stroke-width="2.5">
    <circle cx="58" cy="46" r="19" fill="url(#pcb)"/>
    <circle cx="142" cy="46" r="19" fill="url(#pcb)"/>
  </g>
  <g fill="none" stroke="#e0a868" stroke-width="2">
    <circle cx="58" cy="46" r="8"/><circle cx="142" cy="46" r="8"/>
  </g>
  <circle cx="58" cy="46" r="3" fill="#e0a868"/><circle cx="142" cy="46" r="3" fill="#e0a868"/>

  <!-- head -->
  <ellipse cx="100" cy="88" rx="56" ry="52" fill="url(#pcb)" stroke="#c98a4a" stroke-width="2.5"/>

  <!-- copper traces on the head -->
  <g fill="none" stroke="#d99a55" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 38 V54 L92 62"/>
    <path d="M62 66 H72 L78 60"/>
    <path d="M138 66 H128 L122 60"/>
    <path d="M52 92 H62 L70 100 V110"/>
    <path d="M148 92 H138 L130 100 V110"/>
    <path d="M84 126 L92 132 H108 L116 126"/>
  </g>
  <g fill="#e8b273">
    <circle cx="100" cy="38" r="3"/><circle cx="92" cy="62" r="2.6"/>
    <circle cx="62" cy="66" r="2.6"/><circle cx="138" cy="66" r="2.6"/>
    <circle cx="52" cy="92" r="2.6"/><circle cx="148" cy="92" r="2.6"/>
    <circle cx="70" cy="110" r="2.6"/><circle cx="130" cy="110" r="2.6"/>
  </g>

  <!-- muzzle: lighter board area with a chip nose -->
  <ellipse cx="100" cy="108" rx="26" ry="19" fill="#1d6a5f" stroke="#c98a4a" stroke-width="2"/>
  <g fill="#c98a4a">
    <rect x="88" y="94" width="2" height="4"/><rect x="93" y="94" width="2" height="4"/><rect x="98" y="94" width="2" height="4"/><rect x="103" y="94" width="2" height="4"/><rect x="108" y="94" width="2" height="4"/>
  </g>
  <rect x="86" y="97" width="28" height="13" rx="3" fill="#121a1c"/>
  <circle cx="90" cy="101" r="1.3" fill="#5c6b70"/>
  <path d="M100 111 V115 M100 115 Q93 122 88 117 M100 115 Q107 122 112 117" fill="none" stroke="#e8b273" stroke-width="2.4" stroke-linecap="round"/>

  <!-- LED eyes -->
  <g filter="url(#glow)">
    <circle cx="80" cy="80" r="6" fill="#7cf0a8"/>
    <circle cx="120" cy="80" r="6" fill="#7cf0a8"/>
  </g>
  <circle cx="80" cy="80" r="2.6" fill="#eafff2"/><circle cx="120" cy="80" r="2.6" fill="#eafff2"/>
  <g fill="none" stroke="#c98a4a" stroke-width="1.6"><circle cx="80" cy="80" r="8.5"/><circle cx="120" cy="80" r="8.5"/></g>

  <!-- vines: traces turning into living plants -->
  <g fill="none" stroke="#5fae4a" stroke-width="2.4" stroke-linecap="round">
    <path d="M58 27 C54 18 60 12 66 16"/>
    <path d="M142 27 C150 18 144 10 136 14"/>
    <path d="M100 38 C104 30 98 24 104 18"/>
    <path d="M30 196 C34 176 22 168 30 154"/>
    <path d="M170 196 C166 178 180 170 172 156"/>
  </g>
  <use href="#leaf" x="62" y="6" width="10" height="16" transform="rotate(25 67 14)"/>
  <use href="#leaf" x="130" y="4" width="10" height="16" transform="rotate(-25 135 12)"/>
  <use href="#leaf" x="102" y="8" width="10" height="16" transform="rotate(20 107 16)"/>
  <use href="#leaf" x="24" y="144" width="12" height="18" transform="rotate(-20 30 153)"/>
  <use href="#leaf" x="166" y="146" width="12" height="18" transform="rotate(20 172 155)"/>
  <use href="#leaf" x="18" y="170" width="10" height="16" transform="rotate(-60 23 178)"/>

  <!-- chest chip with a crescent moon -->
  <g transform="translate(100 168)">
    <g fill="#c98a4a">
      <rect x="-20" y="-17" width="3" height="5"/><rect x="-11" y="-17" width="3" height="5"/><rect x="-2" y="-17" width="3" height="5"/><rect x="7" y="-17" width="3" height="5"/><rect x="16" y="-17" width="3" height="5"/>
      <rect x="-27" y="-8" width="5" height="3"/><rect x="-27" y="1" width="5" height="3"/><rect x="22" y="-8" width="5" height="3"/><rect x="22" y="1" width="5" height="3"/>
    </g>
    <rect x="-23" y="-13" width="46" height="26" rx="3" fill="#121a1c"/>
    <path d="M4 -6 A8 8 0 1 0 4 6 A6.2 6.2 0 1 1 4 -6 Z" fill="#f1e6c8"/>
    <circle cx="-18" cy="-8" r="1.4" fill="#5c6b70"/>
  </g>
  <!-- traces from chip into the board -->
  <g fill="none" stroke="#d99a55" stroke-width="2.2" stroke-linecap="round">
    <path d="M77 168 H60 L50 178"/>
    <path d="M123 168 H140 L150 178"/>
  </g>
  <circle cx="50" cy="178" r="2.6" fill="#e8b273"/><circle cx="150" cy="178" r="2.6" fill="#e8b273"/>
</svg>
