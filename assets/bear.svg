<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Cartoon bear in glasses and a blazer, holding a shield with a lock">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8580"/>
      <stop offset="1" stop-color="#1f5c5c"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6638"/>
      <stop offset="1" stop-color="#7a4a22"/>
    </linearGradient>
    <clipPath id="clipB"><rect x="0" y="28" width="200" height="172" rx="14"/></clipPath>
  </defs>

  <!-- teal block (like the photo's) -->
  <rect x="0" y="28" width="200" height="172" rx="14" fill="url(#bgB)"/>

  <g clip-path="url(#clipB)">
    <!-- blazer -->
    <path d="M18 200 C22 160 48 142 100 140 C152 142 178 160 182 200 Z" fill="#232c3b"/>
    <!-- shirt -->
    <path d="M78 141 L100 176 L122 141 C114 139 86 139 78 141 Z" fill="#a9c6e3"/>
    <path d="M100 176 L92 150 L100 146 L108 150 Z" fill="#8fb1d4"/>
    <!-- lapels -->
    <path d="M76 142 L100 182 L86 200 L64 200 L60 156 Z" fill="#2c3748"/>
    <path d="M124 142 L100 182 L114 200 L136 200 L140 156 Z" fill="#2c3748"/>
    <!-- neck fur -->
    <path d="M80 132 Q100 148 120 132 L118 146 Q100 154 82 146 Z" fill="#7a4a22"/>
  </g>

  <!-- ears -->
  <circle cx="58" cy="44" r="20" fill="#7a4a22"/>
  <circle cx="58" cy="44" r="10" fill="#c99868"/>
  <circle cx="142" cy="44" r="20" fill="#7a4a22"/>
  <circle cx="142" cy="44" r="10" fill="#c99868"/>

  <!-- head -->
  <ellipse cx="100" cy="88" rx="56" ry="54" fill="url(#fur)"/>
  <!-- cheek tufts -->
  <path d="M46 98 l-8 6 l10 2 Z M154 98 l8 6 l-10 2 Z" fill="#7a4a22"/>

  <!-- muzzle -->
  <ellipse cx="100" cy="110" rx="27" ry="21" fill="#d6a978"/>
  <ellipse cx="100" cy="100" rx="10" ry="7" fill="#2a1a10"/>
  <ellipse cx="97" cy="98" rx="3" ry="1.6" fill="#ffffff" opacity=".5"/>
  <path d="M100 107 L100 113 M100 113 Q92 121 86 115 M100 113 Q108 121 114 115" fill="none" stroke="#2a1a10" stroke-width="3" stroke-linecap="round"/>

  <!-- eyes -->
  <circle cx="80" cy="80" r="5" fill="#1a110a"/>
  <circle cx="120" cy="80" r="5" fill="#1a110a"/>
  <circle cx="81.6" cy="78.4" r="1.6" fill="#fff"/>
  <circle cx="121.6" cy="78.4" r="1.6" fill="#fff"/>
  <!-- brows -->
  <path d="M70 64 Q80 60 89 64 M111 64 Q120 60 130 64" fill="none" stroke="#5a3418" stroke-width="3" stroke-linecap="round"/>

  <!-- glasses -->
  <g fill="none" stroke="#151a20" stroke-width="3.2">
    <rect x="64" y="69" width="31" height="23" rx="8" fill="#ffffff" fill-opacity=".12"/>
    <rect x="105" y="69" width="31" height="23" rx="8" fill="#ffffff" fill-opacity=".12"/>
    <path d="M95 78 Q100 74 105 78"/>
    <path d="M64 76 L48 72 M136 76 L152 72"/>
  </g>
  <path d="M70 74 l6 -2" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".6"/>
  <path d="M111 74 l6 -2" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".6"/>

  <!-- shield with lock, held by a paw -->
  <g transform="translate(132 138)">
    <path d="M24 0 L46 8 V26 C46 42 36 52 24 58 C12 52 2 42 2 26 V8 Z" fill="#f2c14e" stroke="#8a6414" stroke-width="2.5"/>
    <path d="M24 6 L40 12 V26 C40 38 33 46 24 51 Z" fill="#ffffff" opacity=".18"/>
    <rect x="15" y="25" width="18" height="15" rx="3" fill="#2a3446"/>
    <path d="M18 25 V20 a6 6 0 0 1 12 0 V25" fill="none" stroke="#2a3446" stroke-width="3"/>
    <circle cx="24" cy="31" r="2.4" fill="#f2c14e"/>
    <rect x="23" y="32" width="2" height="5" fill="#f2c14e"/>
  </g>
  <!-- paw over the shield's edge -->
  <g transform="translate(120 160)">
    <ellipse cx="16" cy="14" rx="17" ry="14" fill="#7a4a22"/>
    <ellipse cx="16" cy="17" rx="8" ry="6" fill="#c99868"/>
    <circle cx="6" cy="7" r="3.2" fill="#c99868"/>
    <circle cx="14" cy="4" r="3.2" fill="#c99868"/>
    <circle cx="23" cy="6" r="3.2" fill="#c99868"/>
  </g>
</svg>
