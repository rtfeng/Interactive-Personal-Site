<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Bear form: a chubby bear with a sprout on its head, hugging a big round shield with a crescent moon">
  <defs>
    <linearGradient id="bgK" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a817b"/>
      <stop offset="1" stop-color="#1b5555"/>
    </linearGradient>
    <radialGradient id="furK" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#b07a46"/>
      <stop offset="1" stop-color="#7d4c24"/>
    </radialGradient>
    <radialGradient id="shK" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#38515a"/>
      <stop offset="1" stop-color="#1a272d"/>
    </radialGradient>
    <mask id="moonK"><rect x="0" y="0" width="200" height="200" fill="#000"/><circle cx="96" cy="174" r="15" fill="#fff"/><circle cx="104" cy="169" r="13" fill="#000"/></mask>
    <clipPath id="clipK"><rect x="0" y="28" width="200" height="172" rx="14"/></clipPath>
    <symbol id="lfK" viewBox="-6 -10 12 20"><path d="M0 9 C-7 3 -6 -6 0 -9 C6 -6 7 3 0 9 Z" fill="#7cc35a"/><path d="M0 8 V-7" stroke="#3f7d2c" stroke-width="1.2"/></symbol>
  </defs>

  <rect x="0" y="28" width="200" height="172" rx="14" fill="url(#bgK)"/>

  <g clip-path="url(#clipK)">
    <!-- round chubby body -->
    <ellipse cx="100" cy="190" rx="76" ry="56" fill="url(#furK)"/>
    <ellipse cx="100" cy="196" rx="44" ry="34" fill="#d9ad7c"/>
  </g>

  <!-- sprout on the head -->
  <path d="M100 42 C100 32 98 26 100 18" fill="none" stroke="#4f9a3c" stroke-width="3" stroke-linecap="round"/>
  <use href="#lfK" x="86" y="10" width="14" height="22" transform="rotate(-50 93 21)"/>
  <use href="#lfK" x="100" y="6" width="14" height="22" transform="rotate(45 107 17)"/>

  <!-- ears -->
  <circle cx="56" cy="54" r="17" fill="#7d4c24"/>
  <circle cx="56" cy="55" r="9" fill="#e4b98c"/>
  <circle cx="144" cy="54" r="17" fill="#7d4c24"/>
  <circle cx="144" cy="55" r="9" fill="#e4b98c"/>

  <!-- big round head -->
  <ellipse cx="100" cy="92" rx="56" ry="52" fill="url(#furK)"/>

  <!-- blush -->
  <ellipse cx="66" cy="106" rx="10" ry="6" fill="#f08a7a" opacity=".55"/>
  <ellipse cx="134" cy="106" rx="10" ry="6" fill="#f08a7a" opacity=".55"/>

  <!-- determined little brows -->
  <path d="M70 72 L86 76 M130 72 L114 76" stroke="#4e2c12" stroke-width="3.6" stroke-linecap="round"/>

  <!-- eyes -->
  <ellipse cx="80" cy="88" rx="7" ry="8" fill="#1d120b"/>
  <ellipse cx="120" cy="88" rx="7" ry="8" fill="#1d120b"/>
  <circle cx="82.5" cy="85" r="2.6" fill="#fff"/>
  <circle cx="122.5" cy="85" r="2.6" fill="#fff"/>
  <circle cx="78" cy="91" r="1.1" fill="#fff" opacity=".8"/>
  <circle cx="118" cy="91" r="1.1" fill="#fff" opacity=".8"/>

  <!-- muzzle -->
  <ellipse cx="100" cy="110" rx="21" ry="15" fill="#e4b98c"/>
  <path d="M93 102 Q100 98 107 102 Q107 107 100 109 Q93 107 93 102 Z" fill="#2a1a10"/>
  <ellipse cx="98" cy="102" rx="2.6" ry="1.3" fill="#fff" opacity=".6"/>
  <path d="M100 109 V113 M100 113 Q95 119 90 115 M100 113 Q105 119 110 115" fill="none" stroke="#2a1a10" stroke-width="2.6" stroke-linecap="round"/>

  <!-- big round shield, hugged -->
  <g clip-path="url(#clipK)">
    <circle cx="100" cy="176" r="38" fill="url(#shK)" stroke="#e0a868" stroke-width="4"/>
    <circle cx="100" cy="176" r="30" fill="none" stroke="#c98a4a" stroke-width="1.6" stroke-opacity=".7"/>
    <g fill="#f0b877">
      <circle cx="100" cy="142" r="2.2"/><circle cx="72" cy="158" r="2.2"/><circle cx="128" cy="158" r="2.2"/>
    </g>
    <!-- crescent moon -->
    <rect x="0" y="0" width="200" height="200" fill="#f4ead0" mask="url(#moonK)"/>
    <!-- tiny lock on the moon -->
    <rect x="104" y="177" width="11" height="9" rx="2" fill="#e0a868"/>
    <path d="M106 177 V174 a3.5 3.5 0 0 1 7 0 V177" fill="none" stroke="#e0a868" stroke-width="2"/>
    <circle cx="109.5" cy="181" r="1.3" fill="#1a272d"/>
  </g>

  <!-- stubby paws gripping the shield -->
  <g>
    <ellipse cx="62" cy="168" rx="15" ry="13" fill="#8a5528"/>
    <ellipse cx="62" cy="171" rx="7" ry="5.5" fill="#e4b98c"/>
    <circle cx="54" cy="162" r="2.8" fill="#e4b98c"/><circle cx="61" cy="159" r="2.8" fill="#e4b98c"/><circle cx="68" cy="161" r="2.8" fill="#e4b98c"/>
    <ellipse cx="138" cy="168" rx="15" ry="13" fill="#8a5528"/>
    <ellipse cx="138" cy="171" rx="7" ry="5.5" fill="#e4b98c"/>
    <circle cx="132" cy="161" r="2.8" fill="#e4b98c"/><circle cx="139" cy="159" r="2.8" fill="#e4b98c"/><circle cx="146" cy="162" r="2.8" fill="#e4b98c"/>
  </g>
</svg>
