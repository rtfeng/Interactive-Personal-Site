<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Wayfinder: an academic homepage that guides its visitors">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c4f53"/>
      <stop offset="1" stop-color="#13767c"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="18" fill="url(#grid)"/>

  <!-- text -->
  <text x="72" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#ffffff">Wayfinder</text>
  <text x="74" y="156" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#d9f1ef">An academic homepage that guides its visitors</text>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff">
    <rect x="72" y="196" width="146" height="38" rx="19" fill="#ffffff" fill-opacity="0.14"/>
    <text x="94" y="221">Ask the guide</text>
    <rect x="230" y="196" width="196" height="38" rx="19" fill="#ffffff" fill-opacity="0.14"/>
    <text x="252" y="221">Grouped publications</text>
    <rect x="438" y="196" width="134" height="38" rx="19" fill="#ffffff" fill-opacity="0.14"/>
    <text x="460" y="221">One-click CV</text>
    <rect x="584" y="196" width="180" height="38" rx="19" fill="#ffffff" fill-opacity="0.14"/>
    <text x="606" y="221">No server, no build</text>
  </g>

  <text x="74" y="296" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#9fd6d2">Fork it, swap in your own content, publish on GitHub Pages.</text>

  <!-- mock guide box, right side -->
  <g transform="translate(860 70)" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="350" height="220" rx="14" fill="#ffffff" fill-opacity="0.95"/>
    <text x="22" y="36" font-size="15" font-weight="600" fill="#0c4f53">Ask the guide</text>
    <rect x="22" y="52" width="306" height="40" rx="9" fill="#eef6f5" stroke="#9fd6d2"/>
    <text x="38" y="78" font-size="15" fill="#33504f">what do you teach?</text>
    <g fill="none" stroke="#13767c" stroke-width="2.4" stroke-linecap="round" transform="translate(304 72)">
      <circle r="7"/><line x1="5" y1="5" x2="11" y2="11"/>
    </g>
    <rect x="22" y="110" width="306" height="28" rx="6" fill="#e3f1ef"/>
    <rect x="34" y="120" width="190" height="8" rx="4" fill="#13767c" fill-opacity="0.55"/>
    <rect x="22" y="146" width="306" height="28" rx="6" fill="#e3f1ef"/>
    <rect x="34" y="156" width="150" height="8" rx="4" fill="#13767c" fill-opacity="0.55"/>
    <rect x="22" y="182" width="306" height="28" rx="6" fill="#e3f1ef"/>
    <rect x="34" y="192" width="220" height="8" rx="4" fill="#13767c" fill-opacity="0.55"/>
  </g>
</svg>
